# Local MinShap on a single MNIST digit.
name: mnist_local_minshap
seed: 0

data:
  source: mnist
  n_train: 5000
  n_test: 1000
  patch_size: 4

model:
  kind: neural_net
  params:
    max_epochs: 20
    lr: 0.001

method:
  kind: minshap
  params:
    K: 50
    alpha: 0.05
    loss: zero_one
    n_jobs: 1

local:
  enabled: true
  query_index: 42
  k: 50
